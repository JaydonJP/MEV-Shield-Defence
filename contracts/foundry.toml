[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
remappings = ["forge-std/=lib/forge-std/src/"]

[invariant]
runs = 64
depth = 48
fail_on_revert = true

[fmt]
line_length = 110

[lint]
lint_on_build = false
