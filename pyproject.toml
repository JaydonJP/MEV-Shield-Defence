[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mevshield"
version = "1.0.0"
description = "MEV Shield — a visual Ethereum security lab with Sepolia wallet integration"
requires-python = ">=3.11,<3.14"
dependencies = [
  "web3>=7,<8",
  "typer>=0.12",
  "rich>=13",
  "scikit-learn>=1.4",
  "pandas>=2.1",
  "numpy>=1.26",
  "requests>=2.31",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "websockets>=12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27,<1"]

[project.scripts]
mevshield = "mevshield.cli:app"

[tool.setuptools.packages.find]
include = ["mevshield*"]

[tool.setuptools.package-data]
"mevshield.web" = ["static/*"]
